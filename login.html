<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="assets/plugins/bootstrap-4.6.1-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/plugins/fontawesome-free-5.15.4-web/css/all.min.css">
    
    <title>OWP</title>
    <style>
        body {
          background-color: #f8f9fa;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
        }
        .card {
          max-width: 400px;
          width: 100%;
        }
      </style>
  </head>
  <body>
     <!-- ID je login-card (kartica) -->
    <div class="card shadow p-4" id="login-card" style="display:none">
      <div class="card-body">
        <h2 class="text-center mb-4">Login</h2>

        <!-- ID login-form je samo na formi -->
        <form id="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" class="form-control" placeholder="Unesite email" required>
          </div>

          <div class="form-group">
            <label for="password">Lozinka</label>
            <input type="password" id="password" class="form-control" placeholder="Unesite lozinku" required>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Prijavi se</button>
        </form>

        <p id="error-message" class="text-danger text-center mt-3"></p>
      </div>
    </div>

    <script src="assets/plugins/jquery/jquery-3.6.0.min.js"></script>
    <script type="module" src="js/login.js"></script>
  </body>
</html>
