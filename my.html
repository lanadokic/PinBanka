<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="assets/plugins/bootstrap-4.6.1-dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/plugins/fontawesome-free-5.15.4-web/css/all.min.css">
  <link rel="stylesheet" href="assets/css/custom.css">
  <title>PIN banka - Moji računi</title>
</head>
<body>
  <div id="main-content" style="display:none;">
    <nav class="navbar navbar-expand-lg navbar-light bg-white">
      <a class="navbar-brand" href="index.html"><i class="fas fa-university mr-2 text-primary"></i>PIN banka</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav mr-auto" id="navbar-links"></ul>
        <button id="logout-button" class="btn btn-outline-danger btn-sm"><i class="fas fa-sign-out-alt mr-1"></i>Odjavi se</button>
      </div>
    </nav>

    <div class="container py-4">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <div>
          <h1 class="h4 mb-0">Moji računi</h1>
          <small class="text-muted">Pregled vlastitih računa i transakcija</small>
        </div>
      </div>

      <div class="card">
        <div class="card-body">
          <div class="form-group mb-3">
            <input id="search" class="form-control" placeholder="Traži... (live)">
          </div>
          <div class="table-responsive">
            <table class="table table-hover" id="tbl-my">
              <thead class="thead-dark">
                <tr>
                  <th>Broj računa</th>
                  <th>Tip</th>
                  <th>Stanje</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal transakcije (read-only) -->
    <div class="modal fade" id="modal-my-tx" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="my-tx-title">Transakcije</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
          </div>
          <div class="modal-body">
            <div class="form-group">
              <input id="search2" class="form-control" placeholder="Traži transakcije... (live)">
            </div>
            <div class="table-responsive">
              <table class="table table-hover" id="tbl-my-tx">
                <thead class="thead-dark">
                  <tr>
                    <th>Datum</th>
                    <th>Vrsta</th>
                    <th>Iznos</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-dismiss="modal">Zatvori</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="assets/plugins/jquery/jquery-3.6.0.min.js"></script>
  <script src="assets/plugins/bootstrap-4.6.1-dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/pages/my.js"></script>
</body>
</html>
